name: Sync & Update Changelogs

on:
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab
  schedule:
    - cron: '0 6 */2 * *' # Automatically runs every 2 days at 06:00 UTC

permissions:
  contents: write

jobs:
  update-changelogs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch and regenerate changelogs
        run: python3 fetch_changelogs.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add changelogs/ CHANGELOG_MAP.md
          if git diff --staged --quiet; then
            echo "No new changelog updates found."
          else
            git commit -m "chore: sync latest changelogs from nanos-world API [skip ci]"
            git push
          fi
